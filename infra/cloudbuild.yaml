# Atlas Cloud Build pipeline.
#
# One trigger per service. This file is parameterized by ${_SERVICE} substitution.
# Configure two triggers in Cloud Build:
#   1. agents-on-push:    _SERVICE=coordinator|discovery|strategy|developer|...
#   2. dashboard-on-push: _SERVICE=dashboard
#
# Both deploy to Cloud Run in us-central1.

steps:
  # ---- Build the container ----
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/atlas/${_SERVICE}:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/atlas/${_SERVICE}:latest'
      - '-f'
      - '${_DOCKERFILE}'
      - '.'

  # ---- Push to Artifact Registry ----
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/atlas/${_SERVICE}'

  # ---- Deploy to Cloud Run ----
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'atlas-${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/atlas/${_SERVICE}:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=atlas-${_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--no-cpu-throttling'
      - '--set-env-vars=^;^GOOGLE_CLOUD_PROJECT=${PROJECT_ID};GOOGLE_CLOUD_LOCATION=${_REGION};GOOGLE_GENAI_USE_VERTEXAI=true;ATLAS_ENV=${_ATLAS_ENV};RESEND_FROM=${_RESEND_FROM};AGENT_URL_COORDINATOR=https://atlas-coordinator-${PROJECT_NUMBER}.${_REGION}.run.app;AGENT_URL_DISCOVERY=https://atlas-discovery-${PROJECT_NUMBER}.${_REGION}.run.app;AGENT_URL_STRATEGY=https://atlas-strategy-${PROJECT_NUMBER}.${_REGION}.run.app;AGENT_URL_DESIGNER=https://atlas-designer-${PROJECT_NUMBER}.${_REGION}.run.app;AGENT_URL_DEVELOPER=https://atlas-developer-${PROJECT_NUMBER}.${_REGION}.run.app;AGENT_URL_PM=https://atlas-pm-${PROJECT_NUMBER}.${_REGION}.run.app;AGENT_URL_ACCOUNT=https://atlas-account-${PROJECT_NUMBER}.${_REGION}.run.app'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'us-central1'
  _SERVICE: 'coordinator'
  _DOCKERFILE: 'agents/coordinator/Dockerfile'
  _ATLAS_ENV: 'staging'
  _IMAGE_TAG: 'latest'
  # Launch-email sender (non-secret). The RESEND_API_KEY secret is wired
  # separately via Secret Manager on the account service (see README/infra).
  _RESEND_FROM: 'Atlas <launch@mail.rubicx.io>'

timeout: '1200s'
